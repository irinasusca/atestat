    <title>Login - Clinicum Center Cluj</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
        <!-- Define Google callback IMMEDIATELY (before modules load) -->
         
    <script>
        ///asta o functionat, era race condition 
        // This runs synchronously and defines the function ASAP
        window.handleGoogleSignIn = async function(response) {
            try {
                const googleToken = response.credential;
                
                const res = await fetch('https://atestat.onrender.com/api/auth/google', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: googleToken })
                });
                
                if (!res.ok) {
                    const error = await res.json();
                    throw new Error(error.message);
                }
                
                await new Promise(resolve => setTimeout(resolve, 300));
                // Redirect to programari
                window.location.href = './programari.html';
                
            } catch (error) {
                console.error('Google login error:', error);
                alert('Google login failed: ' + error.message);
            }
        }
    </script>

            </p>
            
            <!-- Google Sign-In Button (Official Google Button) -->
            <div class="flex justify-center mb-6">
                <div id="g_id_onload"
                    data-client_id="252892524201-thj8mqhiahg52qoin80fge9ui2t4lu0t.apps.googleusercontent.com"
                    data-callback="handleGoogleSignIn"
                    data-auto_prompt="false">
                </div>
                <div class="g_id_signin" 
                    data-type="standard"
                    data-size="large"
                    data-theme="outline"
                    data-text="signin_with"
                    data-shape="rectangular"
                    data-logo_alignment="left"
                    data-width="380">
                </div>
            </div>
            
            <!-- Divider -->
            <div class="flex items-center gap-4 mb-6">
                <div class="flex-1 border-t border-gray-300"></div>
                <span class="text-gray-500 text-sm">Sau loghează-te cu</span>
                <div class="flex-1 border-t border-gray-300"></div>
            </div>
            
            <!-- Login Form -->
            <form id="login-form" class="space-y-5">
                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-left text-gray-700 font-semibold mb-2">
                        Email
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        required
                        class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 transition-colors"
                        placeholder="exemplu@email.com"
                    >
                </div>
                
                <!-- Password Input -->
                <div>
                    <label for="parola" class="block text-left text-gray-700 font-semibold mb-2">
                        Password
                    </label>
                    <input 
                        type="password" 
                        id="parola" 
                        name="parola"
                        required
                        class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 transition-colors"
                        placeholder="••••••••"
                    >
                </div>
                
                
                <!-- Sign In Button -->
                <button 
                    type="submit"
                    class="w-full bg-blue-600 text-white font-semibold py-4 rounded-lg hover:bg-blue-700 transition-colors shadow-lg mt-6"
                >
                    Sign in
                </button>
            </form>
        </div>
    </div>
    
    <script>
        // Frontend form handling (you'll add backend API call here)
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const parola = document.getElementById('parola').value;
            
            console.log('Login attempt:', { email, parola });
            
            try {
                 const response = await fetch('https://atestat.onrender.com/api/auth/login', {
                     method: 'POST',
                     headers: { 'Content-Type': 'application/json' },
                     credentials: 'include',
                     body: JSON.stringify({ email, parola })
                 });
                 
                                
                 if (!response.ok) {
                    alert('Login failed');
                     
                 } else {
                     alert('Login successful!');
                     await new Promise(resolve => setTimeout(resolve, 300));
                     window.location.href = './index.html';
                 }
             } catch (error) {
                 console.error('Login error:', error);
                 alert('An error occurred. Please try again.');
             }
        });
    </script>
    <script type="module" src="/src/main.ts"></script>
