                    </a>
                </div>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center justify-center flex-1 mx-8">
                    <div class="flex items-center space-x-8">
                        <a href="./index.html" class="text-gray-700 hover:text-blue-700 transition-colors">Home</a>

                    </div>
                </div>

                <!-- Desktop Login -->
                <div class="hidden md:flex items-center">

                </div>

                <!-- Mobile Menu Button -->
                <div class="md:hidden">

            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-t border-gray-200">
            <div class="px-4 pt-2 pb-4 space-y-3">
                <a href="./index.html" class="block text-gray-700 hover:text-blue-600 hover:bg-gray-50 px-3 py-2 rounded-md transition-colors">Home</a>
                <a href="./about.html" class="block text-gray-700 hover:text-blue-600 hover:bg-gray-50 px-3 py-2 rounded-md transition-colors">Despre noi</a>
                <a href="./services.html" class="block text-gray-700 hover:text-blue-600 hover:bg-gray-50 px-3 py-2 rounded-md transition-colors">Servicii</a>
                <a href="./index.html#locations" class="block text-gray-700 hover:text-blue-600 hover:bg-gray-50 px-3 py-2 rounded-md transition-colors">Locatii</a>
                <a href="./doctors.html" class="block text-gray-700 hover:text-blue-600 hover:bg-gray-50 px-3 py-2 rounded-md transition-colors">Doctori</a>
                <a href="./pricing.html" class="block text-gray-700 hover:text-blue-600 hover:bg-gray-50 px-3 py-2 rounded-md transition-colors">Tarife</a>

            </div>

    <!-- Background Image with Overlay -->
    <div class="absolute inset-0 z-0">
        <img src="background-login.jpg" alt="Background" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black opacity-20"></div>
    </div>
    
    <!-- Login Container -->
    <div class="relative z-10 min-h-screen flex items-center justify-center px-4 py-12">
        <!-- White Login Box -->
        <div class="bg-white rounded-2xl shadow-2xl p-8 md:p-12 w-full max-w-md md:max-w-lg">
            <!-- Sign Up Link -->
            <p class="text-center text-gray-700 mb-8 text-base">
                Nu ai un cont? 
                <a href="register.html" class="text-blue-600 font-semibold hover:text-blue-700 transition-colors">
                    Înregistrează-te
                </a>
            </p>
            
            <!-- Google Sign In Button -->
            <button class="w-full flex items-center justify-center gap-3 border-2 border-gray-300 rounded-lg px-6 py-3 hover:bg-gray-50 transition-colors mb-6">
                <svg class="w-6 h-6" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span class="font-semibold text-gray-700">Continuă cu Google</span>
            </button>
            
            <!-- Divider -->
            <div class="flex items-center gap-4 mb-6">
                <div class="flex-1 border-t border-gray-300"></div>
                <span class="text-gray-500 text-sm">Sau loghează-te cu</span>
                <div class="flex-1 border-t border-gray-300"></div>
            </div>
            
            <!-- Login Form -->
            <form id="login-form" class="space-y-5">
                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-left text-gray-700 font-semibold mb-2">
                        Email
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        required
                        class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 transition-colors"
                        placeholder="exemplu@email.com"
                    >
                </div>
                
                <!-- Password Input -->
                <div>
                    <label for="parola" class="block text-left text-gray-700 font-semibold mb-2">
                        Password
                    </label>
                    <input 
                        type="password" 
                        id="parola" 
                        name="parola"
                        required
                        class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 transition-colors"
                        placeholder="••••••••"
                    >
                </div>
                
                <!-- Forgot Password Link -->
                <div class="text-right">
                    <a href="forgot-password.html" class="text-sm text-blue-600 hover:text-blue-700 transition-colors">
                        Ai uitat parola?
                    </a>
                </div>
                
                <!-- Sign In Button -->
                <button 
                    type="submit"
                    class="w-full bg-blue-600 text-white font-semibold py-4 rounded-lg hover:bg-blue-700 transition-colors shadow-lg mt-6"
                >
                    Sign in
                </button>
            </form>
        </div>
    </div>
    
    <script>
        // Frontend form handling (you'll add backend API call here)
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const parola = document.getElementById('parola').value;
            
            console.log('Login attempt:', { email, parola });
            
            try {
                 const response = await fetch('/api/auth/login', {
                     method: 'POST',
                     headers: { 'Content-Type': 'application/json' },
                     credentials: 'include',
                     body: JSON.stringify({ email, parola })
                 });
                 
                                
                 if (!response.ok) {
                    alert('Login failed');
                     
                 } else {
                     alert('Login successful!');
                     window.location.href = '/dashboard.html';
                 }
             } catch (error) {
                 console.error('Login error:', error);
                 alert('An error occurred. Please try again.');
             }
        });
    </script>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
