    <script src="https://accounts.google.com/gsi/client" async defer></script>
        <!-- Define Google callback IMMEDIATELY (before modules load) -->
         
    <script>
        ///asta o functionat, era race condition 
        // This runs synchronously and defines the function ASAP
        window.handleGoogleSignIn = async function(response) {
            try {
                const googleToken = response.credential;
                
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: googleToken })
                });
                
                if (!res.ok) {
                    const error = await res.json();
                    throw new Error(error.message);
                }
                
                // Redirect to programari
                window.location.href = './programari.html';
                
            } catch (error) {
                console.error('Google login error:', error);
                alert('Google login failed: ' + error.message);
            }
        }
    </script>

                        id="email" 
                        name="email"
                        required
                        class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 transition-colors"

                 <!-- Username Input -->

                    <label for="username" class="block text-left text-gray-700 font-semibold mb-2">

                        type="text" 
                        id="username"

                <!-- Password Input -->
                <div>
                    <label for="parola" class="block text-left text-gray-700 font-semibold mb-2">
                        Parolă

                    <input 
                        type="password" 
                        id="parola" 
                        name="parola"
                        required
                        minlength="8"
                        class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-600 transition-colors"
                        placeholder="••••••••"

                <!-- Terms and Conditions -->

                    <input 
                        type="checkbox" 
                        id="terms" 
                        name="terms"
                        required
                        class="mt-1 w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                    >

    <script>
        // Frontend form handling (you'll add backend API call here)
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nume = document.getElementById('nume').value;
            const prenume = document.getElementById('prenume').value;
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const parola = document.getElementById('parola').value;
            const terms = document.getElementById('terms').checked;
            
    
            if (!email || !email.includes("@")) {
                throw new Error("Invalid email");
            }

            if (!terms) {
                alert('Trebuie să accepți termenii și condițiile!');
                return;
            }
            
            ///acum, ascundem dev stuff, si polishing la niste chestii.
            //console.log('Register attempt:', { username, nume, prenume, email, parola, terms });
            
            // TODO: Add your API call here
            // Example:
             try {
                 const response = await fetch('/api/auth/register', {
                     method: 'POST',
                     headers: { 'Content-Type': 'application/json' },
                     credentials: 'include',
                     body: JSON.stringify({ username, nume, prenume, email, parola })
                 });
                 
                                
                 if (!response.ok) {
                    alert('Registration failed');
                     
                 } else {
                     alert('Cont creat cu succes!');
                     window.location.href = './login.html';
                 }
             } catch (error) {
                 console.error('Registration error:', error);
                 alert('An error occurred. Please try again.');
             }
        });
    </script>
